<div>
    <h2 class="text-lg font-semibold text-slate-900 dark:text-white">
        Transaction details
    </h2>

    <p class="mt-1 text-sm text-slate-500 dark:text-[#A1A1AA]">
        Enter your expected monthly transaction activity.
    </p>

    <div class="mt-6 space-y-5">

        <div>
            <label for="transactionAmount" class="mb-2 block text-sm font-medium text-slate-700 dark:text-[#D4D4D4]">
                Amount per transaction
            </label>

            <div
                class="flex items-center rounded-xl border border-slate-200 bg-white transition focus-within:border-violet-500 focus-within:ring-2 focus-within:ring-violet-100 dark:border-[#383838] dark:bg-[#202020] dark:focus-within:border-violet-500 dark:focus-within:ring-violet-500/20">
                <span class="pl-4 text-sm font-medium text-slate-500 dark:text-[#A1A1AA]">
                    ₦
                </span>

                <input id="transactionAmount" type="number" min="0" step="0.01" placeholder="e.g. 2500.00"
                    class="w-full rounded-xl bg-transparent px-3 py-3 text-sm text-slate-900 outline-none placeholder:text-slate-400 dark:text-white dark:placeholder:text-[#737373]"
                    [value]="amountInputValue" (input)="onAmountInput($any($event.target).value)" />
            </div>

            @if (amountError) {
                <p class="mt-2 text-xs text-red-600 dark:text-red-400">
                    {{ amountError }}
                </p>
            } @else {
                <p class="mt-2 text-xs text-slate-400 dark:text-[#737373]">
                    Enter the amount for a single transaction.
                </p>
            }
        </div>

        <div>
            <label for="transactionCount" class="mb-2 block text-sm font-medium text-slate-700 dark:text-[#D4D4D4]">
                Number of transactions per month
            </label>

            <input id="transactionCount" type="number" min="0" step="1" placeholder="e.g. 500"
                class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-100 dark:border-[#383838] dark:bg-[#202020] dark:text-white dark:placeholder:text-[#737373] dark:focus:border-violet-500 dark:focus:ring-violet-500/20"
                [value]="countInputValue" (input)="onCountInput($any($event.target).value)" />

            @if (countError) {
                <p class="mt-2 text-xs text-red-600 dark:text-red-400">
                    {{ countError }}
                </p>
            } @else {
                <p class="mt-2 text-xs text-slate-400 dark:text-[#737373]">
                    Enter your expected number of monthly transactions.
                </p>
            }
        </div>

    </div>
</div>
