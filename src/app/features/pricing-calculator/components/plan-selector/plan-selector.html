
<div>
    <h2 class="text-lg font-semibold text-slate-900 dark:text-white">
        Choose a pricing plan
    </h2>

    <p class="mt-1 text-sm text-slate-500 dark:text-[#A1A1AA]">
        Select the plan that best suits your transaction volume.
    </p>

    <div class="mt-5 space-y-3">
        @for (plan of plans(); track plan.id) {
        <button
            type="button"
            class="w-full rounded-xl border border-slate-200 bg-white p-4 text-left transition hover:border-violet-400 hover:bg-violet-50 dark:border-[#303030] dark:bg-[#1B1B1B] dark:hover:border-violet-500 dark:hover:bg-[#22202A]"
            (click)="planSelected.emit(plan.id)"
            [class.border-violet-600]="selectedPlan() === plan.id"
            [class.bg-violet-50]="selectedPlan() === plan.id"
            [class.dark:!border-violet-500]="selectedPlan() === plan.id"
            [class.dark:!bg-[#241B35]]="selectedPlan() === plan.id"
            [attr.aria-pressed]="selectedPlan() === plan.id"
        >
            <div class="flex items-center justify-between">
                <span class="font-semibold text-slate-900 dark:text-white">
                    {{ plan.name }}
                </span>

                <span class="font-semibold text-violet-600 dark:text-[#B69AFF]">
                    {{ plan.rateInBasisPoints / 100 }}%
                </span>
            </div>

            <p class="mt-1 text-sm text-slate-500 dark:text-[#A1A1AA]">
                {{ plan.description }}
            </p>
        </button>
        }
    </div>
</div>
