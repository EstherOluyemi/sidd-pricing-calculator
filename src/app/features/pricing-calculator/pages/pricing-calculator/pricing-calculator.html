<div class="min-h-screen bg-gradient-to-br from-violet-50/60 via-slate-50 to-white px-4 py-8 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-6xl">

        <header class="mb-10 flex flex-col justify-between gap-5 sm:flex-row sm:items-center">
            <div>
                <div class="mb-4 inline-flex items-center gap-2">
                    <img src="/public/SID logo.png" alt="SIDD logo" class="h-10 w-auto object-contain" />
                    <span class="text-sm font-bold tracking-wide text-violet-700">
                        SIDD
                    </span>
                </div>

                <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
                    Pricing Calculator
                </h1>

                <p class="mt-2 text-sm text-slate-500">
                    Estimate your monthly transaction processing costs.
                </p>
            </div>

            <div
                class="inline-flex w-fit items-center gap-2 rounded-full border border-emerald-100 bg-white px-4 py-2 shadow-sm">
                <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
                <span class="text-xs font-medium text-slate-600">
                    Live calculation
                </span>
            </div>
        </header>

        <main>
            <div class="mb-6">
                <p class="text-xs font-semibold uppercase tracking-widest text-violet-600">
                    Calculator
                </p>

                <h2 class="mt-1 text-xl font-semibold text-slate-900">
                    Configure your estimate
                </h2>

                <p class="mt-1 text-sm text-slate-500">
                    Select a plan and enter your expected transaction details.
                </p>
            </div>

            <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

                <section
                    class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-[0_4px_20px_rgba(15,23,42,0.04)] transition-shadow hover:shadow-md">
                    <app-plan-selector [plans]="pricingPlans" [selectedPlan]="selectedPlan()"
                        (planSelected)="selectedPlan.set($event)">
                    </app-plan-selector>
                </section>

                <section
                    class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-[0_4px_20px_rgba(15,23,42,0.04)] transition-shadow hover:shadow-md">
                    <app-transaction-inputs [amount]="transactionAmount()" [count]="transactionCount()"
                        (amountChanged)="transactionAmount.set($event)" (countChanged)="transactionCount.set($event)">
                    </app-transaction-inputs>
                </section>

            </div>

            <section
                class="mt-6 rounded-2xl border border-slate-200/80 bg-white p-6 shadow-[0_4px_20px_rgba(15,23,42,0.04)]">
                <app-cost-summary [monthlyVolume]="monthlyVolume()" [feePerTransaction]="feePerTransaction()"
                    [monthlyFees]="monthlyFees()" [vat]="vat()" [totalMonthlyCost]="totalMonthlyCost()">
                </app-cost-summary>
            </section>

        </main>
    </div>
</div>
