<div class="min-h-screen bg-slate-50 px-4 py-8 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-6xl">


        <header class="mb-10">
            <p class="mb-2 text-sm font-semibold uppercase tracking-wider text-violet-600">
                SIDD
            </p>

            <h1 class="text-3xl font-bold tracking-tight text-slate-900">
                Pricing Calculator
            </h1>

            <p class="mt-2 text-sm text-slate-500">
                Estimate your monthly transaction processing costs.
            </p>
        </header>

        <main>
            <div class="mb-6">
                <h2 class="text-lg font-semibold text-slate-900">
                    Configure your estimate
                </h2>

                <p class="mt-1 text-sm text-slate-500">
                    Select a plan and enter your expected transaction details.
                </p>
            </div>

            <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

                <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                    <app-plan-selector [plans]="pricingPlans" [selectedPlan]="selectedPlan()"
                        (planSelected)="selectedPlan.set($event)"></app-plan-selector>
                </section>

                <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                    <app-transaction-inputs [amount]="transactionAmount()" [count]="transactionCount()"
                        (amountChanged)="transactionAmount.set($event)"
                        (countChanged)="transactionCount.set($event)"></app-transaction-inputs>
                </section>

            </div>

            <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                <app-cost-summary [monthlyVolume]="monthlyVolume()" [feePerTransaction]="feePerTransaction()"
                    [monthlyFees]="monthlyFees()" [vat]="vat()"
                    [totalMonthlyCost]="totalMonthlyCost()"></app-cost-summary>
            </section>

        </main>
    </div>
</div>
